services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}"
      DATABASE_TIMEOUT: "${DATABASE_TIMEOUT-3s}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or process environment}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL-15m}"
      REDIS_ADDR: "${REDIS_ADDR-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD-}"
      REDIS_DB: "${REDIS_DB-0}"
      CACHE_TTL: "${CACHE_TTL-1m}"
      REDIS_DIAL_TIMEOUT: "${REDIS_DIAL_TIMEOUT-200ms}"
      REDIS_OPERATION_TIMEOUT: "${REDIS_OPERATION_TIMEOUT-100ms}"
      # Preserve explicitly empty values so application validation rejects them.
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT-5s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT-10s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT-10s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT-60s}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT-10s}"
    stop_grace_period: "${API_STOP_GRACE_PERIOD:-30s}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2.2-alpine
    # Cache data is disposable: no volume, snapshot, or append-only persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}"
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
      - 'exec migrate -path /migrations -database "$${DATABASE_URL:?DATABASE_URL is required}" "$$@"'
      - migrate
    command: ["up"]

volumes:
  postgres_data:
