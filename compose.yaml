services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}"
      DATABASE_TIMEOUT: "${DATABASE_TIMEOUT-3s}"
      # Preserve explicitly empty values so application validation rejects them.
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT-5s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT-10s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT-10s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT-60s}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT-10s}"
    stop_grace_period: "${API_STOP_GRACE_PERIOD:-30s}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "${DATABASE_URL-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}"]

volumes:
  postgres_data:
