name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up documentation validator
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Check Go source
        run: ./scripts/check-go.ps1
      - name: Validate OpenAPI and examples
        run: |
          python -m pip install -r scripts/requirements-docs.txt
          if ($LASTEXITCODE -ne 0) { throw 'Validator installation failed' }
          python scripts/validate-openapi.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenAPI validation failed' }
      - name: Validate Compose
        run: |
          docker compose --env-file .env.example config --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Compose configuration is invalid' }
      - name: Run isolated PostgreSQL and Redis integration tests
        id: integration
        run: ./scripts/integration.ps1
      - name: Ensure integration resources are removed
        if: always() && steps.integration.outputs.compose_project != ''
        env:
          TEST_COMPOSE_PROJECT: ${{ steps.integration.outputs.compose_project }}
        run: |
          if ($env:TEST_COMPOSE_PROJECT -notmatch '^taskflow-integration-[a-f0-9]{8}$') { throw 'Unsafe cleanup project name' }
          docker compose --env-file .env.example -p $env:TEST_COMPOSE_PROJECT -f compose.yaml -f scripts/compose.cache-test.yaml down --volumes
          if ($LASTEXITCODE -ne 0) { throw 'Integration cleanup failed' }
