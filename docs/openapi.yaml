openapi: 3.0.3
info:
  title: TaskFlow API
  version: 0.1.0
  description: REST API for collaborative project and task management. JSON success responses use data;
    collections also use meta; errors use error. Body size is limited to 4096 bytes. Length constraints
    apply after documented trimming; byte limits are described separately. Ordinary JSON string fields
    treat null as omission/zero value; PATCH requires an effective change. All IDs are positive int64.
    JWT signature/expiration are verified before protected handlers, followed by current-user and project
    permissions. Unknown routes return JSON 404; unsupported methods on matched routes return JSON 405
    with Allow. Request IDs are generated by the server. No refresh-token, user-list, single-member GET
    or single-comment GET endpoints exist.
servers:
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
tags:
- name: System
- name: Authentication
- name: Projects
- name: Members
- name: Tasks
- name: Comments
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check HTTP liveness
      description: Public HTTP liveness; does not check PostgreSQL or cache.
      tags:
      - System
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /ready:
    get:
      operationId: getReady
      summary: Check database readiness
      description: Public PostgreSQL ping with a deadline. Cache availability does not affect readiness.
      tags:
      - System
      responses:
        '200':
          $ref: '#/components/responses/Ready'
        '503':
          $ref: '#/components/responses/NotReady'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a user
      description: Public registration with bcrypt password hashing. Email uniqueness uses its normalized
        form.
      tags:
      - Authentication
      responses:
        '201':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailExists'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              email: alex@example.com
              password: local-example-password-123
              display_name: Alex
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Obtain an access token
      description: Public login. Unknown emails and wrong passwords return the same safe 401. HS256 JWT
        contains only sub, iat and exp. No refresh tokens.
      tags:
      - Authentication
      responses:
        '200':
          $ref: '#/components/responses/AccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: alex@example.com
              password: local-example-password-123
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Read the current user
      description: Requires a valid JWT and an existing user. Password hashes are never returned.
      tags:
      - Authentication
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects:
    post:
      operationId: createProject
      summary: Create a project
      description: Any existing authenticated user. Project and owner membership are created atomically.
      tags:
      - Projects
      responses:
        '201':
          description: Project response.
          headers:
            X-Request-ID:
              description: Server-generated request ID.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: Relative URI of the created resource; member/comment item URIs support PATCH/DELETE,
                not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
              example:
                data:
                  id: 1
                  name: Portfolio
                  description: TaskFlow release
                  owner_id: 1
                  created_at: '2026-10-15T10:00:00Z'
                  updated_at: '2026-10-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              name: Portfolio
              description: TaskFlow release
    get:
      operationId: listProjects
      summary: List my projects
      description: Only projects with current membership, ordered by project ID ascending. Unsupported,
        repeated or empty query parameters return 400.
      tags:
      - Projects
      responses:
        '200':
          $ref: '#/components/responses/ProjectCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
  /api/v1/projects/{projectID}:
    parameters:
    - $ref: '#/components/parameters/projectID'
    get:
      operationId: getProject
      summary: Read a project
      description: 'Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. '
      tags:
      - Projects
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: Update a project
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Only owner/admin may update.
      tags:
      - Projects
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            example:
              description: Updated description
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Only owner may delete. Memberships, tasks and comments cascade.
      tags:
      - Projects
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectID}/members:
    parameters:
    - $ref: '#/components/parameters/projectID'
    get:
      operationId: listMembers
      summary: List project members
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Ordered by user ID ascending. Only page/page_size are supported, once
        each, with nonempty values.
      tags:
      - Members
      responses:
        '200':
          $ref: '#/components/responses/MemberCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
    post:
      operationId: addMember
      summary: Add an existing user
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Owner can manage admin/member roles; admin can only add, update or
        remove ordinary members. Owner membership cannot be changed or removed. No owner transfer or invitation
        flow. Unknown target user returns 404; duplicate membership returns 409.
      tags:
      - Members
      responses:
        '201':
          description: Member response.
          headers:
            X-Request-ID:
              description: Server-generated request ID.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: Relative URI of the created resource; member/comment item URIs support PATCH/DELETE,
                not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
              example:
                data:
                  project_id: 1
                  user_id: 2
                  role: member
                  joined_at: '2026-10-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
            example:
              user_id: 2
              role: member
  /api/v1/projects/{projectID}/members/{userID}:
    parameters:
    - $ref: '#/components/parameters/projectID'
    - $ref: '#/components/parameters/userID'
    patch:
      operationId: updateMember
      summary: Change a member role
      description: 'Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Owner can manage admin/member roles; admin can only add, update or
        remove ordinary members. Owner membership cannot be changed or removed. No owner transfer or invitation
        flow. '
      tags:
      - Members
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
            example:
              role: admin
    delete:
      operationId: deleteMember
      summary: Remove a member
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Owner can manage admin/member roles; admin can only add, update or
        remove ordinary members. Owner membership cannot be changed or removed. No owner transfer or invitation
        flow. Historical task assignment and comment authorship are retained; removed members immediately
        lose access.
      tags:
      - Members
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectID}/tasks:
    parameters:
    - $ref: '#/components/parameters/projectID'
    post:
      operationId: createTask
      summary: Create a task
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Any member may create; creator is the authenticated user, status starts
        as todo, priority defaults to medium.
      tags:
      - Tasks
      responses:
        '201':
          description: Task response.
          headers:
            X-Request-ID:
              description: Server-generated request ID.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: Relative URI of the created resource; member/comment item URIs support PATCH/DELETE,
                not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
              example:
                data:
                  id: 1
                  project_id: 1
                  title: Review documentation
                  description: Check API examples
                  status: todo
                  priority: medium
                  assignee_id: null
                  creator_id: 1
                  due_date: null
                  created_at: '2026-10-15T10:00:00Z'
                  updated_at: '2026-10-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            example:
              title: Review documentation
              assignee_id: null
              due_date: null
    get:
      operationId: listTasks
      summary: Filter and list tasks
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Filters combine with AND. Search matches title OR description. Unknown,
        repeated, or empty query values return 400. Sorting has an ID tie-break in the selected direction,
        NULLS LAST; priority order low/medium/high and status order todo/in_progress/done. Count and page
        share a repeatable-read snapshot; separate page requests may observe concurrent writes.
      tags:
      - Tasks
      responses:
        '200':
          $ref: '#/components/responses/TaskCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/priority'
      - $ref: '#/components/parameters/assignee_id'
      - $ref: '#/components/parameters/creator_id'
      - $ref: '#/components/parameters/due_from'
      - $ref: '#/components/parameters/due_to'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
  /api/v1/projects/{projectID}/tasks/{taskID}:
    parameters:
    - $ref: '#/components/parameters/projectID'
    - $ref: '#/components/parameters/taskID'
    get:
      operationId: getTask
      summary: Read a task
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Task must belong to the supplied project; a mixed project/task pair
        returns 404 after membership checks.
      tags:
      - Tasks
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTask
      summary: Update a task
      description: 'Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Owner/admin or task creator may manage the task. Assignee may PATCH
        status only; other members cannot mutate it. Transitions: todo -> in_progress, in_progress ->
        todo/done, done -> in_progress; repeating status allowed. Invalid transition returns 409. Permissions,
        membership, assignment and transitions are rechecked in the locked write transaction.'
      tags:
      - Tasks
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
            example:
              status: in_progress
              assignee_id: null
              due_date: null
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Only owner/admin or task creator may delete. Comments cascade.
      tags:
      - Tasks
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectID}/tasks/{taskID}/comments:
    parameters:
    - $ref: '#/components/parameters/projectID'
    - $ref: '#/components/parameters/taskID'
    post:
      operationId: createComment
      summary: Create a comment
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Any member may comment on a task in this project; author is set by
        the server.
      tags:
      - Comments
      responses:
        '201':
          description: Comment response.
          headers:
            X-Request-ID:
              description: Server-generated request ID.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: Relative URI of the created resource; member/comment item URIs support PATCH/DELETE,
                not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
              example:
                data:
                  id: 1
                  task_id: 1
                  author_id: 1
                  body: Examples verified
                  created_at: '2026-10-15T10:00:00Z'
                  updated_at: '2026-10-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
            example:
              body: Examples verified
    get:
      operationId: listComments
      summary: List task comments
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Task must belong to project. Ordered by comment ID ascending. Only
        page/page_size are supported, once each, with nonempty values.
      tags:
      - Comments
      responses:
        '200':
          $ref: '#/components/responses/CommentCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
  /api/v1/projects/{projectID}/tasks/{taskID}/comments/{commentID}:
    parameters:
    - $ref: '#/components/parameters/projectID'
    - $ref: '#/components/parameters/taskID'
    - $ref: '#/components/parameters/commentID'
    patch:
      operationId: updateComment
      summary: Update a comment
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Only current project owner/admin or comment author may modify a comment.
        Task creator/assignee has no extra moderation rights. Project, task and comment must match; otherwise
        404 after membership checks.
      tags:
      - Comments
      responses:
        '200':
          $ref: '#/components/responses/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'One JSON object, at most 4096 bytes. Unknown fields and trailing JSON values are
          rejected. Send Content-Type: application/json; the current decoder does not enforce the request
          media type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
            example:
              body: Examples verified
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: Requires current project membership; a nonmember gets 403 for an existing project,
        a missing project gets 404. Only current project owner/admin or comment author may modify a comment.
        Task creator/assignee has no extra moderation rights. Project, task and comment must match; otherwise
        404 after membership checks.
      tags:
      - Comments
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
