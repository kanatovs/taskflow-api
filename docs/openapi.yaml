        maximum: 2147483647
        default: 1
    page_size:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    status:
      name: status
      in: query
      schema:
        type: string
        enum:
        - todo
        - in_progress
        - done
    priority:
      name: priority
      in: query
      schema:
        type: string
        enum:
        - low
        - medium
        - high
    assignee_id:
      name: assignee_id
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
    creator_id:
      name: creator_id
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
    due_from:
      name: due_from
      in: query
      schema:
        type: string
        format: date-time
        description: RFC3339 timestamp; responses use UTC.
      description: Inclusive lower due-date bound; must not be after due_to. Tasks without a due date
        do not match.
    due_to:
      name: due_to
      in: query
      schema:
        type: string
        format: date-time
        description: RFC3339 timestamp; responses use UTC.
      description: Inclusive upper due-date bound. Encode + as %2B in timezone offsets.
    search:
      name: search
      in: query
      schema:
        type: string
        description: Case-insensitive literal substring in title or description; trimmed; at most 200
          characters without controls. %, _ and backslash are literal.
        minLength: 1
        maxLength: 200
    sort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - id
        - created_at
        - updated_at
        - due_date
        - priority
        - status
        - title
        default: id
    order:
      name: order
      in: query
      schema:
        type: string
        enum:
